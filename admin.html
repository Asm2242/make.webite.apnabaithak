<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Make Websites</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html { scroll-behavior: smooth; }
  .gradient-text { background: linear-gradient(to right, #3b82f6, #10b981); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">

<header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
    <a href="index.html" class="text-2xl font-extrabold tracking-tight gradient-text">Make Websites</a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
      <a href="index.html" class="hover:text-white transition">Home</a>
      <a href="pricing.html" class="hover:text-white transition">Pricing</a>
      <a href="about.html" class="hover:text-white transition">About</a>
      <a href="contact.html" class="hover:text-white transition">Contact</a>
    </nav>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div id="loginBox" class="max-w-sm mx-auto rounded-2xl bg-slate-800/60 border border-slate-700 p-8">
    <h1 class="text-2xl font-bold mb-4 text-center">Admin Login</h1>
    <input id="adminPass" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 focus:border-blue-500 focus:outline-none text-white mb-4" />
    <button id="loginBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-emerald-500 text-white font-bold transition">Login</button>
    <p id="loginErr" class="text-red-400 text-sm mt-3 hidden text-center">Wrong password</p>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
      <h1 class="text-2xl font-bold">Orders Dashboard</h1>
      <div class="flex gap-2">
        <button id="exportBtn" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-sm transition">Export CSV</button>
        <button id="clearBtn" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm transition">Clear All</button>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="rounded-xl bg-slate-800/60 border border-slate-700 p-4">
        <div class="text-slate-400 text-xs">Total Orders</div>
        <div id="statTotal" class="text-2xl font-bold">0</div>
      </div>
      <div class="rounded-xl bg-slate-800/60 border border-slate-700 p-4">
        <div class="text-slate-400 text-xs">New</div>
        <div id="statNew" class="text-2xl font-bold text-blue-400">0</div>
      </div>
      <div class="rounded-xl bg-slate-800/60 border border-slate-700 p-4">
        <div class="text-slate-400 text-xs">Consultations</div>
        <div id="statConsult" class="text-2xl font-bold text-emerald-400">0</div>
      </div>
      <div class="rounded-xl bg-slate-800/60 border border-slate-700 p-4">
        <div class="text-slate-400 text-xs">Plan Orders</div>
        <div id="statPlan" class="text-2xl font-bold text-purple-400">0</div>
      </div>
    </div>

    <div class="overflow-x-auto rounded-2xl border border-slate-700">
      <table class="w-full text-sm">
        <thead class="bg-slate-800 text-slate-300">
          <tr>
            <th class="px-3 py-3 text-left">Date</th>
            <th class="px-3 py-3 text-left">Type</th>
            <th class="px-3 py-3 text-left">Plan</th>
            <th class="px-3 py-3 text-left">Name</th>
            <th class="px-3 py-3 text-left">Phone</th>
            <th class="px-3 py-3 text-left">Business</th>
            <th class="px-3 py-3 text-left">Add-ons</th>
            <th class="px-3 py-3 text-left">Total</th>
            <th class="px-3 py-3 text-left">Status</th>
            <th class="px-3 py-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="ordersBody" class="divide-y divide-slate-700"></tbody>
      </table>
    </div>
    <p id="emptyMsg" class="text-center text-slate-500 mt-6 hidden">No orders yet.</p>
  </div>
</main>

<script>
  const PASS = 'admin123';
  const KEY = 'mw_orders';

  function loadOrders() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
  function saveOrders(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  const loginBtn = document.getElementById('loginBtn');
  loginBtn.addEventListener('click', () => {
    const v = document.getElementById('adminPass').value;
    if (v === PASS) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      render();
    } else {
      document.getElementById('loginErr').classList.remove('hidden');
    }
  });
  document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

  function render() {
    const orders = loadOrders();
    const tbody = document.getElementById('ordersBody');
    tbody.innerHTML = '';
    orders.forEach(o => {
      const tr = document.createElement('tr');
      tr.className = 'bg-slate-900/40';
      tr.innerHTML = `
        <td class="px-3 py-3 whitespace-nowrap">${o.date || ''}</td>
        <td class="px-3 py-3">${o.type || ''}</td>
        <td class="px-3 py-3">${o.plan || ''}</td>
        <td class="px-3 py-3">${o.name || '-'}</td>
        <td class="px-3 py-3">${o.phone || '-'}</td>
        <td class="px-3 py-3">${o.business || '-'}</td>
        <td class="px-3 py-3">${(o.addons || []).join(', ') || '-'}</td>
        <td class="px-3 py-3">${o.total || '-'}</td>
        <td class="px-3 py-3">
          <select data-id="${o.id}" class="statusSel bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs">
            <option ${o.status==='New'?'selected':''}>New</option>
            <option ${o.status==='Contacted'?'selected':''}>Contacted</option>
            <option ${o.status==='Completed'?'selected':''}>Completed</option>
            <option ${o.status==='Cancelled'?'selected':''}>Cancelled</option>
          </select>
        </td>
        <td class="px-3 py-3">
          <button data-id="${o.id}" class="delBtn text-red-400 hover:text-red-300 text-xs">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('statTotal').textContent = orders.length;
    document.getElementById('statNew').textContent = orders.filter(o => o.status === 'New').length;
    document.getElementById('statConsult').textContent = orders.filter(o => o.type === 'Consultation').length;
    document.getElementById('statPlan').textContent = orders.filter(o => o.type === 'Plan Order').length;
    document.getElementById('emptyMsg').classList.toggle('hidden', orders.length !== 0);

    document.querySelectorAll('.statusSel').forEach(sel => {
      sel.addEventListener('change', e => {
        const id = e.target.dataset.id;
        const list = loadOrders();
        const item = list.find(x => x.id === id);
        if (item) { item.status = e.target.value; saveOrders(list); render(); }
      });
    });
    document.querySelectorAll('.delBtn').forEach(btn => {
      btn.addEventListener('click', e => {
        const id = e.target.dataset.id;
        saveOrders(loadOrders().filter(x => x.id !== id));
        render();
      });
    });
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('Clear all orders?')) { saveOrders([]); render(); }
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const orders = loadOrders();
    const headers = ['Date','Type','Plan','Name','Phone','Business','Addons','Total','Status'];
    const rows = orders.map(o => [o.date,o.type,o.plan,o.name,o.phone,o.business,(o.addons||[]).join('; '),o.total,o.status].map(v => `"${(v||'').replace(/"/g,'""')}"`).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'orders.csv'; a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
